<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiesta · Amigo Invisible X</title>
<style>
  :root{--bg:#1b1035;--bg2:#2a1750;--ink:#fff7e6;--muted:#c9b8ff;--pink:#ff4fa3;--yellow:#ffd23f;--teal:#2de2c5;--orange:#ff8a3d}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:var(--ink);background:var(--bg);
    background-image:radial-gradient(circle at 20% 10%,#4b1d8f55,transparent 40%),radial-gradient(circle at 85% 30%,#ff4fa333,transparent 35%);line-height:1.5;min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:0 18px 60px}
  header{text-align:center;padding:26px 0 8px}
  .logo{font-size:4.2rem;font-weight:900;margin:0;color:var(--yellow);text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--teal);line-height:1}
  .logo a{color:inherit;text-decoration:none}
  .sub{color:var(--muted);margin:6px 0 0}
  .steps{display:flex;gap:6px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
  .steps span{font-size:.8rem;padding:3px 10px;border-radius:99px;background:#00000040;color:var(--muted)}
  .steps span.on{background:var(--yellow);color:#1b1035;font-weight:900}
  .box{background:var(--bg2);border:3px solid var(--yellow);border-radius:22px;padding:22px;margin:22px 0;box-shadow:8px 8px 0 var(--pink)}
  h2{margin:0 0 8px;color:var(--yellow);font-size:1.5rem}
  p{margin:8px 0}
  .hint{color:var(--muted);font-size:.95rem}
  select{font:inherit;width:100%;padding:11px 13px;border-radius:12px;border:3px solid #1b1035;background:#fff7e6;color:#1b1035}
  label.cat{display:block;margin:14px 0 4px;font-weight:700;color:var(--teal)}
  .btn{font:inherit;font-weight:900;font-size:1.05rem;border:3px solid #1b1035;border-radius:14px;padding:11px 18px;cursor:pointer;background:var(--yellow);color:#1b1035;box-shadow:4px 4px 0 #1b1035;text-decoration:none;display:inline-block}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #1b1035}
  .btn.alt{background:var(--teal)} .btn.pk{background:var(--pink);color:#fff} .btn.ghost{background:#fff7e6}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.big{font-size:1.3rem;padding:16px 22px;width:100%}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .row > *{flex:1 1 140px}
  .names{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
  .names .btn{width:100%}
  .names .btn.done{background:#00000050;color:var(--muted);box-shadow:none;border-color:#00000060}
  .err{background:#ff4fa344;border:2px solid var(--pink);border-radius:12px;padding:8px 12px;margin:10px 0}
  .stage{text-align:center;padding:6px 0}
  .who{font-size:2.4rem;font-weight:900;color:var(--yellow);text-shadow:3px 3px 0 var(--pink);word-break:break-word}
  .timer{font-size:3.4rem;font-weight:900;font-variant-numeric:tabular-nums;margin:8px 0}
  .bar{height:16px;border-radius:99px;background:#00000050;overflow:hidden;border:2px solid #1b1035}
  .bar i{display:block;height:100%;background:var(--teal);width:0}
  .bar i.ok{background:var(--yellow)}
  .cardx{background:#fff7e6;color:#1b1035;border-radius:14px;padding:12px 16px;margin:10px 0;font-weight:700;transform:rotate(-1deg)}
  .cardx small{display:block;font-weight:400;color:#4b3a7a}
  .tiny{font-size:.85rem;color:var(--muted);text-align:center;margin-top:18px}
  .link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit}
  .prize{font-size:2rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo"><a href="index.html" title="Volver a las instrucciones">AIX</a></h1>
    <p class="sub">La fiesta</p>
    <div class="steps" id="steps"></div>
  </header>
  <main id="app"></main>
  <p class="tiny">Todo ocurre en este dispositivo: no se envía nada a ningún sitio.<br>
    <button class="link" id="reset">Reiniciar la fiesta</button> · <a class="link" href="sorteo.html">Volver al sorteo</a> · <a class="link" href="index.html">Ver instrucciones</a></p>
</div>

<script>
(function(){
  var SKEY = 'aix_sorteo_v1', FKEY = 'aix_fiesta_v1';
  var PHASES = [['turnos','1 · Discursos'],['votos','2 · Votaciones'],['premios','3 · Premios']];
  var CATS = [
    ['absurdo','🎁 Mejor regalo absurdo','Vota a quien lo regaló.'],
    ['poker','🧦 Calcetín del Destino (peor cara de póker)','Quien peor disimuló durante la entrega en silencio.']
  ];
  var MIN = 30; // segundos mínimos de discurso

  var sorteo = null;
  try { sorteo = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch(e){}
  var names = (sorteo && sorteo.names) || [];
  var assign = sorteo && sorteo.assign;
  var F = loadF() || fresh();
  var ui = { err:'', voter:null, who:null, secs:0, running:false, shown:false };
  var tick = null;

  function fresh(){ return { phase:'turnos', order:null, idx:0, votes:{}, voted:{} }; }
  function loadF(){ try{ var r = localStorage.getItem(FKEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
  function save(){ try{ localStorage.setItem(FKEY, JSON.stringify(F)); }catch(e){} }
  function el(tag, attrs, kids){
    var e = document.createElement(tag);
    for (var k in (attrs||{})){
      if (k === 'text') e.textContent = attrs[k];
      else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (kids||[]).forEach(function(c){ if (c) e.appendChild(c); });
    return e;
  }
  function box(title, kids){ var b = el('div',{class:'box'}); if (title) b.appendChild(el('h2',{text:title})); kids.forEach(function(k){ if(k) b.appendChild(k); }); return b; }
  function para(text, cls){ return el('p', {text:text, class:cls||''}); }
  function btn(text, fn, cls, dis){ var b = el('button',{class:'btn '+(cls||''), text:text, onclick:fn, type:'button'}); if (dis) b.disabled = true; return b; }
  function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function fmt(s){ var m = Math.floor(s/60), r = s%60; return m+':'+(r<10?'0':'')+r; }
  function stopTimer(){ if (tick){ clearInterval(tick); tick = null; } ui.running = false; }

  // ---------- 1 · Discursos ----------
  function viewTurnos(){
    if (!F.order) { F.order = shuffle(names.map(function(_,i){return i;})); save(); }
    if (F.idx >= F.order.length){
      return [box('¡Todos han hablado! 👏',[
        para('Ya están todos los discursos. Toca votar.','hint'),
        btn('Pasar a las votaciones →', function(){ F.phase='votos'; save(); render(); }, 'pk big')
      ])];
    }
    var g = F.order[F.idx], r = assign[g];
    var timerEl = el('div',{class:'timer',id:'tm',text:fmt(ui.secs)});
    var fill = el('i',{id:'fill'});
    var msg = el('p',{class:'hint',id:'tmsg',text:'Mínimo '+MIN+' segundos. Máximo: hasta que alguien aplauda por compasión.'});
    var startBtn = btn(ui.running ? '⏸ Pausar' : (ui.secs ? '▶ Seguir' : '▶ Empezar discurso'), function(){
      if (ui.running){ stopTimer(); } else {
        ui.running = true;
        tick = setInterval(function(){ ui.secs++; upd(); }, 1000);
      }
      render();
    }, 'alt');
    function upd(){
      var t = document.getElementById('tm'); if (t) t.textContent = fmt(ui.secs);
      var f = document.getElementById('fill'); if (f){ f.style.width = Math.min(100, ui.secs/MIN*100)+'%'; f.className = ui.secs>=MIN?'ok':''; }
      var m = document.getElementById('tmsg'); if (m && ui.secs>=MIN) m.textContent = '✅ Ya cumples el mínimo. Ahora, ¡que alguien aplauda!';
    }
    function next(){ stopTimer(); ui.secs = 0; ui.shown = false; F.idx++; save(); render(); }
    setTimeout(upd, 0);
    return [box('Turno '+(F.idx+1)+' de '+F.order.length,[
      el('div',{class:'stage'},[
        para('Le toca a…'),
        el('div',{class:'who',text:names[g]}),
        ui.shown
          ? el('div',{},[para('y presenta a su invisible:'), el('div',{class:'who',text:names[r]})])
          : btn('🎭 Revelar a quién presenta', function(){ ui.shown = true; render(); }, 'pk'),
        timerEl,
        el('div',{class:'bar'},[fill]),
        msg
      ]),
      el('div',{class:'row'},[startBtn, btn('👏 Aplauso por compasión', next, 'pk')]),
      el('div',{class:'row'},[btn('Saltar turno →', next, 'ghost')])
    ])];
  }

  // ---------- 2 · Votaciones ----------
  function viewVotos(){
    if (ui.voter !== null){
      var v = ui.voter;
      var others = names.map(function(n,i){return i;}).filter(function(i){return i!==v;});
      var sels = CATS.map(function(c){
        var s = el('select',{'aria-label':c[1]},[el('option',{value:'',text:'— elige —'})].concat(others.map(function(i){ return el('option',{value:String(i),text:names[i]}); })));
        return [c, s];
      });
      return [box('Vota, '+names[v],[
        para('Que nadie mire. No puedes votarte a ti mismo.','hint'),
        el('div',{}, sels.map(function(x){ return el('div',{},[el('label',{class:'cat',text:x[0][1]}), para(x[0][2],'hint'), x[1]]); })),
        ui.err ? el('div',{class:'err',text:ui.err}) : null,
        el('div',{class:'row'},[
          btn('Cancelar', function(){ ui.voter=null; ui.err=''; render(); }, 'ghost'),
          btn('Guardar y ocultar', function(){
            var out = {};
            for (var k=0;k<sels.length;k++){
              if (sels[k][1].value === ''){ ui.err = 'Falta elegir en «'+sels[k][0][1]+'».'; return render(); }
              out[sels[k][0][0]] = +sels[k][1].value;
            }
            F.votes[v] = out; F.voted[v] = true; ui.voter = null; ui.err = ''; save(); render();
          }, 'pk')
        ])
      ])];
    }
    var left = names.filter(function(n,i){ return !F.voted[i]; }).length;
    return [box('Votaciones secretas',[
      para(left ? 'Por turnos: toca tu nombre y vota. Faltan '+left+'.' : '¡Todos han votado! Toca ver los premios.', 'hint'),
      el('div',{class:'names'}, names.map(function(nm,i){
        var done = !!F.voted[i];
        return btn((done?'✓ ':'')+nm, function(){
          if (done && !confirm('¿Cambiar el voto de '+nm+'?')) return;
          ui.voter = i; ui.err=''; render();
        }, done?'done':'');
      })),
      el('div',{class:'row'},[
        btn('← Discursos', function(){ F.phase='turnos'; save(); render(); }, 'ghost'),
        btn('🏆 Ver premios', function(){ F.phase='premios'; save(); render(); }, 'pk', left>0)
      ])
    ])];
  }

  // ---------- 3 · Premios ----------
  function tally(cat){
    var c = names.map(function(){return 0;});
    Object.keys(F.votes).forEach(function(v){ var t = F.votes[v][cat]; if (typeof t === 'number') c[t]++; });
    var max = Math.max.apply(null, c);
    return { counts:c, max:max, winners: max>0 ? c.map(function(x,i){return x===max?i:-1;}).filter(function(i){return i>=0;}) : [] };
  }
  function viewPremios(){
    var cards = CATS.map(function(c){
      var t = tally(c[0]);
      var w = t.winners.map(function(i){ return names[i]; });
      var detail = names.map(function(n,i){return [n,t.counts[i]];}).filter(function(x){return x[1]>0;})
        .sort(function(a,b){return b[1]-a[1];}).map(function(x){return x[0]+' '+x[1];}).join(' · ');
      return el('div',{class:'cardx'},[
        el('span',{class:'prize',text:c[1].split(' ')[0]+' '}),
        el('span',{text:c[1].slice(c[1].indexOf(' ')+1)+': '}),
        el('span',{text: w.length ? w.join(' y ')+(w.length>1?' (¡empate!)':'') : 'sin votos'}),
        el('small',{text:detail || ''})
      ]);
    });
    return [box('🏆 Los premios',[
      para('Debajo de cada premio, los votos recibidos. En caso de empate, desempatad con un duelo de miradas.','hint')
    ].concat(cards).concat([
      el('div',{class:'row'},[btn('← Volver a votar', function(){ F.phase='votos'; save(); render(); }, 'ghost')])
    ]))];
  }

  function render(){
    var app = document.getElementById('app');
    app.textContent = '';
    var st = document.getElementById('steps'); st.textContent = '';
    if (!names.length || !assign){
      app.appendChild(box('Primero, el sorteo',[
        para('Aquí no hay ningún sorteo hecho. Haz el sorteo en este mismo dispositivo y vuelve.','hint'),
        el('a',{class:'btn pk',href:'sorteo.html',text:'🎲 Ir al sorteo'})
      ]));
      return;
    }
    PHASES.forEach(function(p){ st.appendChild(el('span',{class:p[0]===F.phase?'on':'',text:p[1]})); });
    var views = { turnos:viewTurnos, votos:viewVotos, premios:viewPremios };
    (views[F.phase]() || []).forEach(function(n){ app.appendChild(n); });
    window.scrollTo(0,0);
  }

  document.getElementById('reset').addEventListener('click', function(){
    if (!confirm('¿Reiniciar la fiesta? Se borran los turnos y las votaciones (el sorteo se conserva).')) return;
    stopTimer(); F = fresh(); ui = { err:'', voter:null, who:null, secs:0, running:false, shown:false }; save(); render();
  });
  window.addEventListener('beforeunload', function(e){
    if (F.phase !== 'turnos' || F.idx > 0 || Object.keys(F.voted).length){ e.preventDefault(); e.returnValue = ''; }
  });

  render();
})();
</script>
</body>
</html>
